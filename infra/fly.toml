# Fly.io configuration for the API.
#
#   fly launch --config infra/fly.toml --no-deploy
#   fly secrets set AUTH0_DOMAIN=... AUTH0_API_AUDIENCE=... SECRET_KEY=...
#   fly volumes create coffee_data --size 1
#   fly deploy
#
# The frontend is static and belongs on a CDN rather than here; deploy it to
# Static Web Apps, Cloudflare Pages or Render's static tier.

app = "coffee-shop-api"
primary_region = "sea"

[build]
  dockerfile = "../backend/Dockerfile"

[env]
  FLASK_CONFIG = "production"
  PORT = "8000"
  LOG_FORMAT = "json"
  DB_SEED_IF_EMPTY = "true"
  # Matches the volume mount below, and the path App Service persists, so the
  # two deployments behave the same way.
  DATABASE_URL = "sqlite:////home/data/database.db"

# Secrets are set with `fly secrets set` and never appear in this file:
#   AUTH0_DOMAIN, AUTH0_API_AUDIENCE, SECRET_KEY,
#   AUTH0_M2M_CLIENT_ID, AUTH0_M2M_CLIENT_SECRET, CORS_ORIGINS

[[mounts]]
  source = "coffee_data"
  destination = "/home/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # SQLite on a single volume; more than one machine would mean more than one
  # writer against the same file.
  min_machines_running = 1
  max_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
