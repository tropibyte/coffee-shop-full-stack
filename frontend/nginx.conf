# Static hosting for the Angular bundle.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Do not advertise the version in the Server header.
    server_tokens off;

    # A single-page application owns its routing: any path the filesystem
    # does not have must fall through to index.html, or a refresh on
    # /diagnostics is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles are immutable, so they can be cached indefinitely.
    location ~* \.(?:js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must not be cached, or a deploy leaves browsers pointed at
    # bundle names that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # The API is a separate origin and sets its own headers; these cover the
    # documents this server hands out.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml;
}
