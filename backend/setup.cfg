# flake8 has no pyproject support, so its settings live here.
[flake8]
max-line-length = 100
# E203: conflicts with black's slice spacing.
# W503: line break before binary operator; black prefers exactly that.
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    .pytest_cache,
    build,
    dist,
    migrations,
    venv,
    .venv
max-complexity = 12
per-file-ignores =
    # register_error_handlers is a registration function: one small handler
    # per status code.  Splitting it would scatter the JSON error contract
    # across several modules for no gain in readability.
    src/errors.py:C901
    # Route modules get long: an OpenAPI document is data, not logic.
    src/docs.py:C901
    tests/*:D100,D101,D102,D103
