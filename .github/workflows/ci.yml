name: CI

# Everything that must hold before a change is mergeable: style, tests,
# security scanning of both the source and the dependency trees, and a proof
# that the Docker images and the Azure template still build.
#
# No job here needs a secret. Auth0 is never contacted: the backend suite
# mints its own RS256 tokens against a locally generated key pair, so the
# production verification path is exercised without a tenant.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend — style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: flake8 (PEP 8)
        run: flake8 src tests

      - name: black --check
        run: black --check src tests wsgi.py run.py

      - name: isort --check
        run: isort --check-only src tests wsgi.py run.py

  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend — tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the README claims, and the version the container ships.
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing --junitxml=junit.xml

      - name: Access-control matrix
        run: pytest -m rbac -v

      - name: Security regressions
        run: pytest -m security -v

      - name: Fail under 80% coverage
        run: coverage report --fail-under=80

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results-${{ matrix.python-version }}
          path: |
            backend/junit.xml
            backend/coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  backend-security:
    name: Backend — security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: bandit — source-level security linter
        run: bandit -r src -c pyproject.toml -f screen

      - name: pip-audit — dependency advisories
        run: pip-audit --requirement requirements.txt --strict

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: npm audit
        # Advisory, not blocking: a transitive dev-only advisory should not
        # stop a release, but it should be visible in the log.
        run: npm audit --audit-level=high
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/www
          retention-days: 7

  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to scan the whole diff

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No committed Postman tokens
        # The collection is meant to carry JWTs when it is submitted, and
        # never when it is committed.
        run: |
          if grep -qE '"value": *"eyJ[A-Za-z0-9_-]{20,}' \
               backend/udacity-fsnd-udaspicelatte.postman_collection.json; then
            echo "::error::A JWT is committed in the Postman collection."
            echo "Run: python backend/scripts/set_postman_tokens.py --clear"
            exit 1
          fi
          echo "No tokens in the collection."

      - name: No committed .env
        run: |
          if git ls-files --error-unmatch backend/.env infra/.env 2>/dev/null; then
            echo "::error::A .env file is tracked by git."
            exit 1
          fi
          echo "No .env files tracked."

  # ---------------------------------------------------------------------------
  containers:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: coffee-shop-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: coffee-shop-web:ci
          build-args: BUILD_CONFIG=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The API image must not run as root
        run: |
          user=$(docker run --rm --entrypoint sh coffee-shop-api:ci -c 'id -un')
          echo "Image runs as: $user"
          [ "$user" != "root" ] || { echo "::error::image runs as root"; exit 1; }

      - name: The API image must carry no .env
        run: |
          if docker run --rm --entrypoint sh coffee-shop-api:ci -c 'test -f .env'; then
            echo "::error::a .env file was baked into the image"
            exit 1
          fi
          echo "No .env in the image."

  # ---------------------------------------------------------------------------
  infrastructure:
    name: Azure template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile the Bicep template
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --outfile /tmp/main.json
          echo "Bicep compiles."

      - name: Lint the Bicep template
        run: az bicep lint --file infra/main.bicep

  # ---------------------------------------------------------------------------
  api-contract:
    name: Postman collection runs green
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: pip install -r requirements.txt
      - run: npm install --global newman

      - name: The collection matches the generator
        # If someone hand-edits the JSON, the generator and the file diverge.
        run: |
          python scripts/build_postman_collection.py --output /tmp/regenerated.json
          python - <<'PY'
          import json
          with open('udacity-fsnd-udaspicelatte.postman_collection.json') as f:
              committed = json.load(f)
          with open('/tmp/regenerated.json') as f:
              regenerated = json.load(f)
          # Tokens are injected before submission, so auth blocks are expected
          # to differ from a fresh generation; the request set must not.
          def shape(doc):
              return [
                  (folder['name'], [item['name'] for item in folder['item']])
                  for folder in doc['item']
              ]
          if shape(committed) != shape(regenerated):
              raise SystemExit(
                  'The committed collection no longer matches '
                  'scripts/build_postman_collection.py. Re-run the generator.'
              )
          print('Collection matches the generator.')
          PY

      - name: Start the API
        env:
          AUTH0_DOMAIN: ci.example.auth0.com
          AUTH0_API_AUDIENCE: coffee-shop
          MANAGEMENT_API_ENABLED: 'false'
          DB_SEED_IF_EMPTY: 'true'
          LOG_FORMAT: json
        run: |
          python run.py --port 5000 &
          for i in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:5000/health/live && break
            sleep 1
          done

      - name: Run the public and security folders
        # The role folders need real Auth0 tokens, which CI has no business
        # holding. The public folder alone still proves that every protected
        # endpoint answers 401 without credentials, which is the assertion
        # most worth catching a regression in.
        run: |
          newman run udacity-fsnd-udaspicelatte.postman_collection.json \
            --folder public \
            --env-var host=http://127.0.0.1:5000 \
            --reporters cli

  # ---------------------------------------------------------------------------
  summary:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-lint
      - backend-test
      - backend-security
      - frontend
      - secrets-scan
      - containers
      - infrastructure
      - api-contract
    steps:
      - name: Fail if anything upstream failed
        run: |
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qE 'failure|cancelled'; then
            echo "::error::One or more CI jobs did not pass."
            exit 1
          fi
          echo "All CI jobs passed."
